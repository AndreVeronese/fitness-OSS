<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>FITNESS OS</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d10">
<meta name="format-detection" content="telephone=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FITNESS OS">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<style>
html,body{background:#0b0d10;}
:root{
  --bg:#0b0d10; --card:#15181c; --card2:#1b1f24; --line:#262b31;
  --text:#eef1f3; --sub:#8b939c; --accent:#4fd1a5; --accent2:#5b8cff;
  --warn:#f5b942; --danger:#ef5b5b; --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
header{padding:18px 16px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;}
header h1{font-size:13px;letter-spacing:2px;color:var(--sub);margin:0 0 2px;font-weight:600;}
header .greet{font-size:20px;font-weight:700;margin:0;}
main{flex:1;padding:8px 16px 90px;overflow-x:hidden;}
.tab{display:none;}
.tab.active{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;}
.card h3{margin:0 0 10px;font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.metric{background:var(--card2);border-radius:10px;padding:10px 12px;}
.metric .v{font-size:19px;font-weight:700;}
.metric .l{font-size:11px;color:var(--sub);margin-top:2px;}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px;}
.bar > div{height:100%;background:var(--accent);}
.bar.over > div{background:var(--danger);}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
.row:last-child{border-bottom:none;}
.row .sub{color:var(--sub);font-size:12px;}
button{font-family:inherit;cursor:pointer;}
.btn{background:var(--accent);color:#062018;border:none;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;width:100%;}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line);}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;font-size:14px;width:100%;margin-bottom:8px;}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.chip.high{background:#3a1516;color:var(--danger);}
.chip.med{background:#3a2e12;color:var(--warn);}
.chip.low{background:#123a2a;color:var(--accent);}
.insight{border-left:3px solid var(--line);padding:8px 0 8px 12px;margin-bottom:10px;font-size:13.5px;line-height:1.45;}
.insight.high{border-color:var(--danger);} .insight.med{border-color:var(--warn);} .insight.pos{border-color:var(--accent);}
.insight b{display:block;font-size:11px;letter-spacing:.5px;margin-bottom:3px;text-transform:uppercase;}
.insight.high b{color:var(--danger);} .insight.med b{color:var(--warn);} .insight.pos b{color:var(--accent);}
svg{width:100%;height:110px;display:block;}
nav{position:sticky;bottom:0;background:rgba(21,24,28,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px);}
nav button{flex:1;background:none;border:none;color:var(--sub);font-size:10.5px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;}
nav button.active{color:var(--accent);}
nav .ic{font-size:18px;}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:20px 0;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:50;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto;}
.modal h2{margin:0 0 12px;font-size:16px;}
.close{float:right;color:var(--sub);background:none;border:none;font-size:18px;}
.smallbtnrow{display:flex;gap:8px;}
.tag{font-size:11px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--sub);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>FITNESS OS</h1>
    <p class="greet" id="greetText">Olá</p>
  </header>
  <main>
    <div class="tab active" id="tab-home"></div>
    <div class="tab" id="tab-diario"></div>
    <div class="tab" id="tab-peso"></div>
    <div class="tab" id="tab-treino"></div>
    <div class="tab" id="tab-analise"></div>
  </main>
  <nav>
    <button data-tab="home" class="active"><span class="ic">🏠</span>Home</button>
    <button data-tab="diario"><span class="ic">🍽️</span>Diário</button>
    <button data-tab="peso"><span class="ic">⚖️</span>Peso</button>
    <button data-tab="treino"><span class="ic">🏋️</span>Treino</button>
    <button data-tab="analise"><span class="ic">📊</span>Análise</button>
  </nav>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

<script>


/* ===== storage.js ===== */
/* ==========================================================
   StorageProvider
   Abstração sobre o armazenamento local do app.
   Hoje: implementado com localStorage (Web/WKWebView).
   Futuro: pode ser substituído por SQLite nativo (ex.: plugin
   @capacitor-community/sqlite ou @capacitor/preferences) sem
   alterar nenhuma outra parte do app — basta reimplementar
   estes 4 métodos com a mesma assinatura.
   ========================================================== */
/* ==========================================================
   Captura global de erros (item 9 da auditoria).
   Sempre loga no console. Mostra um aviso pequeno e discreto,
   que desaparece sozinho — nunca uma tela de erro permanente.
   ========================================================== */
window.onerror = function(message, source, lineno, colno, error){
  console.error('[FITNESS OS] Erro não tratado:', message, 'em', (source||'')+':'+lineno+':'+colno, error);
  try{
    if(document.getElementById('fos-error-toast')) return false; // já existe um visível
    const t = document.createElement('div');
    t.id = 'fos-error-toast';
    t.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));'
      +'background:#3a1516;color:#ef5b5b;border:1px solid #522;border-radius:10px;padding:8px 12px;'
      +'font:12px -apple-system,sans-serif;z-index:9999;opacity:0.95;';
    t.textContent = 'Algo deu errado nesta ação. Seus dados continuam salvos.';
    document.body.appendChild(t);
    setTimeout(()=>{ t.remove(); }, 4000);
  }catch(e){ /* nunca deixar o handler de erro gerar outro erro */ }
  return false;
};

window.StorageProvider = {
  get(key) {
    try { return localStorage.getItem(key); }
    catch (e) { console.error('StorageProvider.get falhou:', e); return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); return true; }
    catch (e) { console.error('StorageProvider.set falhou:', e); return false; }
  },
  remove(key) {
    try { localStorage.removeItem(key); return true; }
    catch (e) { console.error('StorageProvider.remove falhou:', e); return false; }
  },
  clear() {
    try { localStorage.clear(); return true; }
    catch (e) { console.error('StorageProvider.clear falhou:', e); return false; }
  }
};

/* ==========================================================
   Utilitário de data LOCAL (corrige bug de timezone).
   NUNCA usar new Date().toISOString().slice(0,10) para
   determinar "o dia de hoje" do usuário — isso usa o fuso UTC
   e pode registrar o evento no dia errado perto da meia-noite
   no horário do Brasil (UTC-3). Esta função usa os componentes
   locais do aparelho (getFullYear/getMonth/getDate).
   ========================================================== */
function localDateString(d) {
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
// alias mantido por compatibilidade com o restante do app
function getLocalDateString(d) { return localDateString(d); }
