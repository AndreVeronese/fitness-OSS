<script>


/* ===== storage.js ===== */
/* ==========================================================
   StorageProvider
   Abstração sobre o armazenamento local do app.
   Hoje: implementado com localStorage (Web/WKWebView).
   Futuro: pode ser substituído por SQLite nativo (ex.: plugin
   @capacitor-community/sqlite ou @capacitor/preferences) sem
   alterar nenhuma outra parte do app — basta reimplementar
   estes 4 métodos com a mesma assinatura.
   ========================================================== */
/* ==========================================================
   Captura global de erros (item 9 da auditoria).
   Sempre loga no console. Mostra um aviso pequeno e discreto,
   que desaparece sozinho — nunca uma tela de erro permanente.
   ========================================================== */
window.onerror = function(message, source, lineno, colno, error){
  console.error('[FITNESS OS] Erro não tratado:', message, 'em', (source||'')+':'+lineno+':'+colno, error);
  try{
    if(document.getElementById('fos-error-toast')) return false; // já existe um visível
    const t = document.createElement('div');
    t.id = 'fos-error-toast';
    t.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));'
      +'background:#3a1516;color:#ef5b5b;border:1px solid #522;border-radius:10px;padding:8px 12px;'
      +'font:12px -apple-system,sans-serif;z-index:9999;opacity:0.95;';
    t.textContent = 'Algo deu errado nesta ação. Seus dados continuam salvos.';
    document.body.appendChild(t);
    setTimeout(()=>{ t.remove(); }, 4000);
  }catch(e){ /* nunca deixar o handler de erro gerar outro erro */ }
  return false;
};

window.StorageProvider = {
  get(key) {
    try { return localStorage.getItem(key); }
    catch (e) { console.error('StorageProvider.get falhou:', e); return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); return true; }
    catch (e) { console.error('StorageProvider.set falhou:', e); return false; }
  },
  remove(key) {
    try { localStorage.removeItem(key); return true; }
    catch (e) { console.error('StorageProvider.remove falhou:', e); return false; }
  },
  clear() {
    try { localStorage.clear(); return true; }
    catch (e) { console.error('StorageProvider.clear falhou:', e); return false; }
  }
};

/* ==========================================================
   Utilitário de data LOCAL (corrige bug de timezone).
   NUNCA usar new Date().toISOString().slice(0,10) para
   determinar "o dia de hoje" do usuário — isso usa o fuso UTC
   e pode registrar o evento no dia errado perto da meia-noite
   no horário do Brasil (UTC-3). Esta função usa os componentes
   locais do aparelho (getFullYear/getMonth/getDate).
   ========================================================== */
function localDateString(d) {
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
// alias mantido por compatibilidade com o restante do app
function getLocalDateString(d) { return localDateString(d); }

/* ===== platform.js ===== */
/* ==========================================================
   PlatformProvider
   Camada conceitual para não prender o app ao navegador.
   NENHUMA integração nativa é feita nesta etapa (sem HealthKit,
   sem câmera, sem scanner, sem notificações) — apenas a
   abstração que permitirá plugar um IOSProvider real no futuro,
   quando plugins do Capacitor (Camera, BarcodeScanner, Health,
   PushNotifications, Geolocation, etc.) forem adicionados.
   ========================================================== */
window.PlatformProvider = {
  get current() {
    const isNative = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
    return isNative ? (window.Capacitor.getPlatform ? window.Capacitor.getPlatform() : 'ios') : 'web';
  },
  isNative() {
    return this.current !== 'web';
  }
};

/* ===== pwa.js ===== */
/* ==========================================================
   PWA bootstrap: registro do Service Worker, detecção de modo
   standalone (instalado) e banner de instrução de instalação
   para iOS Safari (que não tem prompt de instalação nativo).
   ========================================================== */

/* ---------- 1) Registro do Service Worker ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((e) => console.error('SW falhou:', e));
  });
  // Quando uma nova versão assume o controle, recarrega UMA vez
  // para garantir que os arquivos novos (já cacheados) sejam usados.
  let refreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshed) return;
    refreshed = true;
    location.reload();
  });
}

/* ---------- 2) Detecção de modo standalone (instalado) ----------
   Não depende só de User-Agent: usa a media query display-mode
   (padrão PWA) e, como reforço específico do iOS, navigator.standalone
   (propriedade não padronizada, mas exposta pelo próprio Safari/WebKit
   — não é uma checagem de string de User-Agent). */
function isStandalone() {
  const byMediaQuery = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  const byIOSFlag = window.navigator.standalone === true;
  return !!(byMediaQuery || byIOSFlag);
}
window.PlatformProvider = window.PlatformProvider || {};
window.PlatformProvider.isStandalone = isStandalone;

/* ---------- 3) Banner de instalação (apenas iOS Safari, não instalado) ---------- */
function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
}
function isSafariBrowser() {
  const ua = navigator.userAgent;
  return /safari/i.test(ua) && !/crios|fxios|edgios|chrome/i.test(ua);
}

const INSTALL_DISMISS_KEY = 'fitnessos_install_banner_dismissed';

function showInstallBannerIfNeeded() {
  if (isStandalone()) return; // já instalado, nunca mostrar
  if (!isIOS() || !isSafariBrowser()) return; // só faz sentido nesse caminho no iOS/Safari
  if (StorageProvider.get(INSTALL_DISMISS_KEY) === '1') return; // usuário já dispensou

  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.style.cssText = `
    position:fixed; left:12px; right:12px;
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
    background:#15181c; border:1px solid #262b31; border-radius:14px;
    padding:12px 14px; color:#eef1f3; font-family:-apple-system,sans-serif;
    font-size:13.5px; line-height:1.4; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.4);
  `;
  banner.innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
      <div><b>Instale o FITNESS OS</b><br>
      Toque em <b>Compartilhar</b> (ícone de seta ⬆️ na barra do Safari) e depois em
      <b>Adicionar à Tela de Início</b>.</div>
      <button id="install-banner-close" style="background:none;border:none;color:#8b939c;font-size:16px;">✕</button>
    </div>`;
  document.body.appendChild(banner);
  document.getElementById('install-banner-close').onclick = () => {
    StorageProvider.set(INSTALL_DISMISS_KEY, '1');
    banner.remove();
  };
}

/* ---------- 4) Ajuste de interface quando já em standalone ---------- */
function applyStandaloneClass() {
  if (isStandalone()) document.documentElement.classList.add('is-standalone');
}

document.addEventListener('DOMContentLoaded', () => {
  applyStandaloneClass();
  showInstallBannerIfNeeded();
});

/* ===== app.js ===== */
/* ---------- STORAGE ---------- */
const DB_KEY='fitnessos_v1';
function arr(v){ return Array.isArray(v) ? v : []; }

/* normalizeDB — garante que TODO campo usado pelo app exista, com
   valores padrão seguros. Nunca substitui dados válidos do usuário
   por dados demo; apenas preenche o que estiver faltando/corrompido. */
function uid(){return Math.random().toString(36).slice(2,9);}
function nowTime(){const d=new Date();return d.toTimeString().slice(0,5);}

/* ==========================================================
   NUTRITION DATA ENGINE
   Arquitetura de múltiplas fontes (providers). Cada alimento
   traz: fonte, nível de confiança e dados por 100g/100ml.
   IMPORTANTE: esta é uma página publicada, 100% client-side,
   sem backend. Chamadas reais a Open Food Facts / USDA exigem
   um servidor (para não expor limites/uso e permitir cache) —
   por isso os providers de rede ficam como adapters "stub",
   prontos para conectar quando houver backend. O provider que
   roda de fato aqui é o LocalFoodDatabaseProvider (curado,
   valores por 100g de fontes nutricionais públicas de
   referência) + UserFoodProvider (alimentos do usuário).
   ========================================================== */
const LOCAL_FOOD_DB = [
  {id:'f001', name:'Arroz branco cozido', category:'Cereais', barcode:null, per100:{kcal:130,protein:2.7,carbs:28.2,fat:0.3,fiber:1.6,sodium:1,potassium:35}, source:'Base nutricional local (referência TACO/USDA)', confidence:'ALTA'},

  {id:'f007', name:'Whey protein (pó)', category:'Suplementos', barcode:'7898923750019', per100:{kcal:400,protein:80,carbs:8,fat:6,fiber:0,sodium:250}, source:'Rótulo do fabricante (cadastro local)', confidence:'MÉDIA'},

  {id:'f009', name:'Hambúrguer bovino congelado', category:'Industrializados', barcode:'7891962057904', per100:{kcal:250,protein:14,carbs:5,fat:20,fiber:0,sodium:480}, source:'Rótulo do fabricante (cadastro local)', confidence:'MÉDIA'},
  {id:'f010', name:'Aveia em flocos', category:'Cereais', barcode:null, per100:{kcal:389,protein:16.9,carbs:66.3,fat:6.9,fiber:10.6,sodium:2,potassium:429}, source:'Base nutricional local (referência USDA)', confidence:'ALTA'},
];
function nutritionSearch(query){
  const userFoods = arr(DB.userFoods).map(f=>({...f, source:f.source||'Cadastro manual do usuário', confidence:'DEPENDENTE DO USUÁRIO'}));
  const all = [...LOCAL_FOOD_DB, ...userFoods];
  const q = (query||'').trim().toLowerCase();
  if(!q) return all.slice(0,8);
  return all.filter(f=>f && f.name && f.name.toLowerCase().includes(q)).slice(0,12);
}
function nutritionByBarcode(code){
  const all = [...LOCAL_FOOD_DB, ...arr(DB.userFoods)];
  return all.find(f=>f && f.barcode && f.barcode===code) || null;
}
// Cálculo determinístico — nunca feito pela IA.
function calcFromPer100(per100, qty){
  const factor = qty/100;
  const out={};
  Object.keys(per100).forEach(k=>{ out[k] = (per100[k]===null||per100[k]===undefined) ? null : round1(per100[k]*factor); });
  return out;
}
function round1(n){return Math.round(n*10)/10;}
function foodUsageCounts(){
  const counts={};
  arr(DB.foodEntries).forEach(e=>{ if(e&&e.name) counts[e.name]=(counts[e.name]||0)+1; });
  return counts;
}
function mostUsedFoods(n=5){
  const counts=foodUsageCounts();
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([name])=>name);
}
function recentFoods(n=6){
  const seen=new Set(); const out=[];
  arr(DB.foodEntries).slice().reverse().forEach(e=>{ if(e&&e.name&&!seen.has(e.name)){seen.add(e.name); out.push(e);} });
  return out.slice(0,n);
}

/* ==========================================================
   SHOE ENGINE — cadastro de tênis + quilometragem automática
   ShoeSearchProvider local (curado). Sem backend, não há busca

  {model:'Saucony Endorphin Speed 4', brand:'Saucony', weightG:230, drop:8, category:'Tempo run'},
];
function shoeSearch(query){
  const q=query.trim().toLowerCase();
  if(!q) return SHOE_DB.slice(0,6);
  return SHOE_DB.filter(s=>s.model.toLowerCase().includes(q)).slice(0,8);
}
function shoeStats(shoeId){
  const runs = arr(DB.runningEntries).filter(r=>r && r.shoeId===shoeId);
  const km = runs.reduce((s,r)=>s+(typeof r.distance==='number'?r.distance:0),0);
  const paceAvg = runs.length ? avg(runs.map(r=>r.distance>0?r.duration/r.distance:0)) : 0;
  return {runs:runs.length, km:round1(km), paceAvg};
}

function normalizeDB(d){
  d = (d && typeof d === 'object') ? d : {};

  d.profile = (d.profile && typeof d.profile === 'object') ? d.profile : {};
  d.profile.name = d.profile.name || 'Usuário';
  d.profile.age = d.profile.age || 30;
  d.profile.sex = d.profile.sex || 'masculino';
  d.profile.height = d.profile.height || 170;
  d.profile.goal = d.profile.goal || 'Saúde geral';
  d.profile.experience = d.profile.experience || 'iniciante';
  d.profile.activity = d.profile.activity || 'moderada';

  d.targets = (d.targets && typeof d.targets === 'object') ? d.targets : {};
  d.targets.kcal = d.targets.kcal || 2200;
  d.targets.protein = d.targets.protein || 150;
  d.targets.carbs = d.targets.carbs || 250;
  d.targets.fat = d.targets.fat || 70;
  d.targets.water = d.targets.water || 2.5;
  d.targets.sleep = d.targets.sleep || 7;
  d.targets.steps = d.targets.steps || 8000;

  d.weightEntries = arr(d.weightEntries).filter(e=>e && e.date && typeof e.weight==='number' && !isNaN(e.weight));
  d.foodEntries = arr(d.foodEntries).filter(e=>e && e.date);
  d.workoutSets = arr(d.workoutSets).filter(e=>e && e.date);
  d.sleepEntries = arr(d.sleepEntries).filter(e=>e && e.date);
  d.hydrationEntries = arr(d.hydrationEntries).filter(e=>e && e.date);
  d.stepsEntries = arr(d.stepsEntries).filter(e=>e && e.date);
  d.runningEntries = arr(d.runningEntries).filter(e=>e && e.date).map(r=>({shoeId:null, ...r}));
  d.userFoods = arr(d.userFoods);
  d.shoes = arr(d.shoes);
  d.measurements = arr(d.measurements);

  return d;
}

/* ---------- HELPERS ---------- */
function entriesFor(arr,date){ if(!Array.isArray(arr)) return []; return arr.filter(e=>e && e.date===date); }
function last(arr,n){return arr.slice(-n);}
function avg(nums){return nums.length? nums.reduce((a,b)=>a+b,0)/nums.length : 0;}
function fmt1(n){return (Math.round(n*10)/10).toFixed(1);}
function fmt0(n){return Math.round(n);}

function weightTrend(){
  const w = arr(DB.weightEntries).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(w.length<2) return {current:w[0]?.weight||0, avg7:w[0]?.weight||0, changeWeek:0, series:w};
  const current = w[w.length-1].weight;
  const last7 = last(w,7).map(e=>e.weight);
  const avg7 = avg(last7);
  const prev7 = w.slice(Math.max(0,w.length-14), Math.max(0,w.length-7)).map(e=>e.weight);
  const avgPrev7 = prev7.length? avg(prev7): avg7;
  const changeWeek = avg7-avgPrev7;
  return {current, avg7, changeWeek, series:w};
}
function todayTotals(){
  const f = entriesFor(DB.foodEntries, todayStr());
  const num = (v)=> (typeof v==='number' && !isNaN(v)) ? v : 0;
  return {
    kcal: f.reduce((s,e)=>s+num(e.kcal),0),
    protein: f.reduce((s,e)=>s+num(e.protein),0),
    carbs: f.reduce((s,e)=>s+num(e.carbs),0),
    fat: f.reduce((s,e)=>s+num(e.fat),0),
    entries:f
  };
}
function todaySleep(){ const list=arr(DB.sleepEntries); const e=list.find(s=>s&&s.date===todayStr()); return e?e.hours:null; }
function todayWater(){ const list=arr(DB.hydrationEntries); const e=list.find(s=>s&&s.date===todayStr()); return e?e.liters:0; }
function todaySteps(){ const list=arr(DB.stepsEntries); const e=list.find(s=>s&&s.date===todayStr()); return e?e.steps:0; }
function avgSleep(n=7){ const list=arr(DB.sleepEntries).slice().sort((a,b)=>a.date.localeCompare(b.date)); return avg(last(list,n).map(e=>e.hours)); }
function avgSteps(n=7){ const list=arr(DB.stepsEntries).slice().sort((a,b)=>a.date.localeCompare(b.date)); return avg(last(list,n).map(e=>e.steps)); }
function sleepPerformancePattern(){
  const low = arr(DB.sleepEntries).filter(s=>s && typeof s.hours==='number' && s.hours<6).map(s=>s.date);
  if(low.length<2) return null;
  const legDays = arr(DB.workoutSets).filter(w=>w && w.exercise && /squat|leg|perna/i.test(w.exercise)).map(w=>w.date);
  const overlap = low.filter(d=>legDays.includes(d));
  if(overlap.length>=2) return `Foi identificado um possível padrão entre noites de sono reduzido (<6h) e dias de treino de pernas (${overlap.length} ocorrências). Isso é uma correlação observada, não uma causalidade confirmada.`;
  return null;
}
/* ==========================================================
   ENERGY EXPENDITURE ENGINE
   Nível 1: estimativa inicial (BMR + atividade)
   Nível 2/3: ajuste adaptativo usando ingestão média + tendência
   de peso real do usuário (mais dados = mais confiança).
   ========================================================== */
function estimateBMR(){
  const p = DB.profile; const w = weightTrend().current || p.weight || 80;
  const h = p.height||175, age=p.age||30;
  // Mifflin-St Jeor
  const base = p.sex==='feminino' ? (10*w + 6.25*h - 5*age - 161) : (10*w + 6.25*h - 5*age + 5);
  return base;
}
function activityFactor(){
  const runs7 = DB.runningEntries.filter(r=>r.date>=daysAgo(7)).length;
  const sets7 = DB.workoutSets.filter(s=>s.date>=daysAgo(7)).length;
  const steps7 = avgSteps(7);
  let factor = 1.3;
  if(sets7>=8) factor += 0.15;
  if(runs7>=2) factor += 0.1;
  if(steps7>9000) factor += 0.1; else if(steps7<5000) factor -= 0.05;
  return Math.min(1.75, Math.max(1.2, factor));
}
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return getLocalDateString(d); }
function energyExpenditure(){
  const bmr = estimateBMR();
  const initial = Math.round(bmr*activityFactor());
  const uniqDays = [...new Set(DB.foodEntries.map(e=>e.date))];
  const uniqWeightDays = DB.weightEntries.length;
  let estimate = initial, confidence='BAIXA', basis='Estimativa inicial (BMR + nível de atividade).';
  if(uniqDays.length>=14 && uniqWeightDays>=14){
    // adaptativo: ingestão média - (variação de peso × 7700 kcal/kg) / dias
    const trend = weightTrend();
    const intake14 = last(uniqDays.slice().sort(),14).map(d=>entriesFor(DB.foodEntries,d).reduce((s,e)=>s+e.kcal,0));
    const avgIntake = avg(intake14.filter(v=>v>0));
    const kcalPerKg = 7700;
    const dailyChangeKcal = (trend.changeWeek/7)*kcalPerKg;
    estimate = Math.round(avgIntake - dailyChangeKcal);
    confidence = uniqDays.length>=28 ? 'MÉDIA/ALTA' : 'MÉDIA';
    basis = 'Calculado a partir da ingestão média registrada e da tendência real de peso nos últimos dias.';
  }
  return {estimate, confidence, basis, bmr:Math.round(bmr)};
}

/* ---------- MEASUREMENTS ---------- */
function latestMeasurement(){ const m=arr(DB.measurements).slice().sort((a,b)=>a.date.localeCompare(b.date)); return m[m.length-1]||null; }
function firstMeasurement(){ const m=arr(DB.measurements).slice().sort((a,b)=>a.date.localeCompare(b.date)); return m[0]||null; }
function measurementDelta(field){
  const a=firstMeasurement(), b=latestMeasurement();
  if(!a||!b||a===b) return null;
  return round1(b[field]-a[field]);
}

function proteinStreakLow(days=3){
  const t=(DB.targets && DB.targets.protein) || 150;
  let count=0;
  const uniq = [...new Set(arr(DB.foodEntries).map(e=>e && e.date).filter(Boolean))].sort().reverse();
  for(const d of uniq.slice(0,days)){
    const p = entriesFor(DB.foodEntries,d).reduce((s,e)=>s+(typeof e.protein==='number'?e.protein:0),0);
    if(p < t*0.8) count++; else break;
  }
  return count>=days;
}

/* ---------- INSIGHTS ENGINE (simplificado) ---------- */
function buildInsights(){
  const insights=[];
  const trend = weightTrend();
  const tt = todayTotals();

  if(proteinStreakLow(3)){
    insights.push({level:'high', title:'Prioridade alta — proteína abaixo do alvo',
      text:`Sua ingestão de proteína ficou abaixo de 80% da meta (${DB.targets.protein}g) nos últimos 3 dias. Com treino de força em andamento, isso é um fator de risco para preservação de massa magra. Ação: acrescente 30–40g de proteína em 1–2 refeições.`});
  }
  if(trend.changeWeek <= -0.7){
    insights.push({level:'med', title:'Atenção — velocidade de perda de peso',
      text:`A média móvel de 7 dias caiu ${fmt1(Math.abs(trend.changeWeek))}kg em relação à semana anterior. Isso é mais rápido que o ritmo geralmente recomendado para preservar massa muscular. Vale observar antes de reduzir mais calorias.`});
  } else if(trend.changeWeek < -0.05){
    insights.push({level:'pos', title:'Tendência de peso',
      text:`Sua média de 7 dias está caindo de forma gradual (${fmt1(trend.changeWeek)}kg/semana), compatível com perda de gordura controlada.`});
  } else if(Math.abs(trend.changeWeek) < 0.05){
    insights.push({level:'med', title:'Peso estável',
      text:`Sua tendência de peso está praticamente estável na última semana. Isso pode indicar manutenção, ou ainda dados insuficientes — observe mais alguns dias antes de tirar conclusões.`});
  }
  if(tt.kcal>0 && tt.kcal < DB.targets.kcal*0.6){
    insights.push({level:'med', title:'Ingestão calórica baixa hoje',
      text:`Você registrou ${fmt0(tt.kcal)} kcal até agora, bem abaixo da meta diária de ${DB.targets.kcal} kcal. Pode ser apenas o dia ainda não ter terminado — dado de baixa confiança até o fim do dia.`});
  }
  const sleepAvg = avgSleep(7);
  if(sleepAvg && sleepAvg < 6){
    insights.push({level:'med', title:'Sono abaixo do habitual',
      text:`Sua média de sono nos últimos 7 dias é de ${fmt1(sleepAvg)}h, abaixo do alvo de ${DB.targets.sleep}h. Sono insuficiente pode afetar recuperação, performance e regulação de apetite.`});
  }
  const pattern = sleepPerformancePattern();
  if(pattern){ insights.push({level:'med', title:'Padrão identificado: sono e treino de pernas', text: pattern}); }
  if(insights.length===0){
    insights.push({level:'pos', title:'Sem alertas relevantes',
      text:'Com os dados disponíveis no momento, não há padrões de atenção prioritária. Continue registrando para aumentar a confiança da análise.'});
  }
  return insights;
}

/* ---------- SPARKLINE SVG ---------- */
function sparkline(points, color){
  if(points.length<2) return '<div class="empty">Dados insuficientes</div>';
  const w=300,h=100,pad=8;
  const min=Math.min(...points), max=Math.max(...points);
  const range = (max-min)||1;
  const step = (w-pad*2)/(points.length-1);
  const pts = points.map((p,i)=>{
    const x = pad + i*step;
    const y = pad + (1-((p-min)/range))*(h-pad*2);
    return `${x},${y}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline fill="none" stroke="${color}" stroke-width="2.5" points="${pts}" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

      ${(DB.shoes||[]).length===0?'<div class="empty">Nenhum tênis cadastrado</div>':
        DB.shoes.map(s=>{const st=shoeStats(s.id); const total=round1((s.initialKm||0)+st.km);
        const alertBox = s.alertKm && total>=s.alertKm ? `<div class="chip med" style="margin-top:6px;">Atingiu ${s.alertKm}km — considere inspecionar o tênis</div>` : '';
        return `<div class="row"><div><b>${s.brand} ${s.model}</b><div class="sub">${st.runs} corridas · ${total}km acumulados · status ${s.status}</div>${alertBox}</div>
        <button class="btn ghost" style="width:auto" onclick="deleteShoe('${s.id}')">excluir</button></div>`;}).join('')}
      <button class="btn secondary" style="margin-top:10px;" onclick="openShoeModal()">+ Cadastrar tênis</button>
    </div>
  `;
}

function safeRender(fn, label, tabId){
  try { fn(); }
  catch(e){
    console.error('[FITNESS OS] Erro ao renderizar "'+label+'":', e);
    const el = document.getElementById(tabId);
    if(el) el.innerHTML = '<div class="card"><h3>Não foi possível carregar esta seção</h3>'
      + '<p style="color:var(--sub);font-size:13px;">Seus dados continuam salvos. Tente trocar de aba e voltar, ou recarregar o app.</p></div>';
  }
}
function renderAll(){
  safeRender(renderHome, 'Home', 'tab-home');
  safeRender(renderDiario, 'Diário', 'tab-diario');
  safeRender(renderPeso, 'Peso', 'tab-peso');
  safeRender(renderTreino, 'Treino', 'tab-treino');
  safeRender(renderAnalise, 'Análise', 'tab-analise');
}

function openFoodModal(){

    </div>

      <label>Nome do alimento</label>
      <input id="f-search" placeholder="Ex: arroz, frango, aveia..." oninput="renderFoodResults()">
      ${recent.length?`<div style="margin:6px 0 10px;">${recent.map(r=>`<span class="tag" style="margin-right:6px;cursor:pointer" onclick="document.getElementById('f-search').value='${r.name.replace(/'/g,"")}';renderFoodResults();">${r.name}</span>`).join('')}</div>`:''}

    </div>
    <div id="food-tab-barcode" style="display:none;">
      <label>Código de barras (EAN/UPC/GTIN)</label>

      <p style="font-size:11.5px;color:var(--sub);margin-top:8px;">Nesta versão (sem backend), a busca consulta a base local cadastrada — não há conexão em tempo real com Open Food Facts/USDA. A arquitetura de providers já está pronta para isso quando houver servidor.</p>
    </div>
    <div id="food-tab-manual" style="display:none;">
      <label>Nome</label><input id="f-name" placeholder="Ex: Prato caseiro">
      <div class="grid2">
        <div><label>Quantidade</label><input id="f-qty" type="number" placeholder="120"></div>
        <div><label>Unidade</label><select id="f-unit"><option>g</option><option>ml</option><option>unidade</option><option>colher</option><option>porção</option></select></div>
      </div>
      <label>Refeição</label>
      <select id="f-meal"><option>Café da manhã</option><option>Almoço</option><option>Jantar</option><option>Pré-treino</option><option>Pós-treino</option><option>Lanche</option><option>Personalizada</option></select>
      <label>Horário</label><input id="f-time" type="time" value="${nowTime()}">
      <div class="grid3">
        <div><label>Kcal</label><input id="f-kcal" type="number" placeholder="0"></div>
        <div><label>Proteína g</label><input id="f-p" type="number" placeholder="0"></div>
        <div><label>Carbo g</label><input id="f-c" type="number" placeholder="0"></div>
      </div>
      <label>Gordura g</label><input id="f-fat" type="number" placeholder="0">
      <button class="btn" onclick="saveFood()">Salvar</button>

  `);

}
function foodTab(t){
  ['search','barcode','manual'].forEach(x=>{ const el=document.getElementById('food-tab-'+x); if(el) el.style.display = x===t?'block':'none'; });
}
function renderFoodResults(){
  const q=(document.getElementById('f-search')?.value)||'';
  const results = nutritionSearch(q);
  const box=document.getElementById('food-results'); if(!box) return;
  box.innerHTML = results.length===0 ? '<div class="empty">Nada encontrado. Tente "Manual" para cadastrar.</div>' :
    results.map(f=>`<div class="row" style="cursor:pointer" onclick="selectFood('${f.id}')">
      <div><b>${f.name}</b><div class="sub">${f.category||''} · fonte: ${f.source} · confiança ${f.confidence}</div></div>
      <div class="sub">${f.per100.kcal} kcal/100g</div>
    </div>`).join('');
}
function findFoodById(id){ return [...LOCAL_FOOD_DB, ...(DB.userFoods||[])].find(f=>f.id===id); }
function selectFood(id){
  const f = findFoodById(id); if(!f) return;
  openModal(`
    <h2>${f.name}</h2>
    <p class="tag">Fonte: ${f.source} · Confiança: ${f.confidence}</p>
    <label>Quantidade</label>
    <div class="grid2">
      <input id="q-qty" type="number" value="100" oninput="updateFoodPreview('${f.id}')">
      <select id="q-unit"><option>g</option><option>ml</option><option>porção</option></select>
    </div>
    <label>Refeição</label>
    <select id="q-meal"><option>Café da manhã</option><option>Almoço</option><option>Jantar</option><option>Pré-treino</option><option>Pós-treino</option><option>Lanche</option></select>
    <label>Horário</label><input id="q-time" type="time" value="${nowTime()}">
    <div class="card" id="food-preview" style="margin-top:10px;"></div>
    <button class="btn" style="margin-top:10px;" onclick="confirmAddFood('${f.id}')">Adicionar ao diário</button>
  `);
  updateFoodPreview(f.id);
}
function updateFoodPreview(id){
  const f=findFoodById(id); const qty=parseFloat(document.getElementById('q-qty')?.value)||0;
  const calc = calcFromPer100(f.per100, qty);
  const line=(k,label)=> calc[k]===null||calc[k]===undefined ? `<div class="row"><span>${label}</span><span class="sub">não informado pela fonte</span></div>` : `<div class="row"><span>${label}</span><span>${calc[k]}${k==='kcal'?'':'g'}</span></div>`;
  document.getElementById('food-preview').innerHTML = `
    <h3>Cálculo (${qty}g)</h3>
    ${line('kcal','Calorias')}${line('protein','Proteína')}${line('carbs','Carboidratos')}${line('fat','Gordura')}${line('fiber','Fibra')}
    <p style="font-size:11.5px;color:var(--sub);margin-top:8px;">Fórmula: valor por 100g × ${qty} ÷ 100. Ex: ${f.per100.kcal} × ${qty} ÷ 100 = ${calc.kcal} kcal.</p>
  `;
}
function confirmAddFood(id){
  const f=findFoodById(id); const qty=parseFloat(document.getElementById('q-qty').value)||0;
  if(!qty){alert('Informe a quantidade');return;}
  const calc = calcFromPer100(f.per100, qty);
  DB.foodEntries.push({id:uid(), date:todayStr(), time:document.getElementById('q-time').value||nowTime(),
    meal:document.getElementById('q-meal').value, name:f.name, qty, unit:document.getElementById('q-unit').value,
    kcal:calc.kcal||0, protein:calc.protein||0, carbs:calc.carbs||0, fat:calc.fat||0,
    source:f.source, confidence:f.confidence});
  saveDB(); closeModal(); renderAll();
}
function lookupBarcode(){
  const code=document.getElementById('f-barcode').value.trim();
  const box=document.getElementById('barcode-result');
  if(!code){ box.innerHTML='<div class="empty">Informe um código</div>'; return; }
  const f = nutritionByBarcode(code);
  if(f){
    box.innerHTML = `<div class="row"><div><b>${f.name}</b><div class="sub">Fonte: ${f.source} · ${f.per100.kcal} kcal/100g</div></div>
      <button class="btn secondary" style="width:auto" onclick="closeModal();selectFood('${f.id}')">Usar</button></div>`;
  } else {
    box.innerHTML = `<div class="empty">Produto não encontrado na base local.</div>
      <div class="smallbtnrow" style="margin-top:8px;">
        <button class="btn secondary" onclick="foodTab('search')">Buscar por nome</button>
        <button class="btn secondary" onclick="foodTab('manual')">Cadastrar manualmente</button>
      </div>`;
  }
}
function saveFood(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){ alert('Informe o nome do alimento'); return; }
  const qty=parseFloat(document.getElementById('f-qty').value)||0;
  const kcal=parseFloat(document.getElementById('f-kcal').value)||0;
  const protein=parseFloat(document.getElementById('f-p').value)||0;
  const carbs=parseFloat(document.getElementById('f-c').value)||0;
  const fat=parseFloat(document.getElementById('f-fat').value)||0;
  DB.foodEntries.push({
    id:uid(), date:todayStr(), time:document.getElementById('f-time').value||nowTime(),
    meal:document.getElementById('f-meal').value, name, qty,
    unit:document.getElementById('f-unit').value, kcal, protein, carbs, fat,
    source:'Cadastro manual do usuário', confidence:'DEPENDENTE DO USUÁRIO'
  });
  // salva também como alimento reutilizável (por 100g), se possível estimar
  if(qty>0){
    DB.userFoods.push({id:uid(), name, category:'Personalizado', barcode:null,
      per100:{kcal:round1(kcal/qty*100), protein:round1(protein/qty*100), carbs:round1(carbs/qty*100), fat:round1(fat/qty*100), fiber:null},
      source:'Cadastro manual do usuário', confidence:'DEPENDENTE DO USUÁRIO'});
  }
  saveDB(); closeModal(); renderAll();
}
function deleteFood(id){ DB.foodEntries=DB.foodEntries.filter(e=>e.id!==id); saveDB(); renderAll(); }
